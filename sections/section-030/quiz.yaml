# Knowledge check for section 030. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats060-030
course_id: ATS060
exam_code: CAPA
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-030
  title: "Understand Argo Workflow Templates"
questions:
  - id: ats060-030-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Define a WorkflowTemplate"
    source_readings:
      - sections/section-030/module-01/course-01-workflowtemplate-definitions-and-references.md
    prompt: "What does creating a WorkflowTemplate object do by itself?"
    options:
      - id: a
        text: "It starts a run of its entrypoint"
        explanation: "A template object is never run directly."
      - id: b
        text: "It stores a definition and creates no run"
        explanation: "Correct: it is only a stored definition."
      - id: c
        text: "It creates a pod for every template"
        explanation: "No pods exist until a Workflow runs."
      - id: d
        text: "It registers a cron schedule"
        explanation: "Schedules belong to CronWorkflow."
    correct_option: b
    explanation: "Correct: it is only a stored definition."

  - id: ats060-030-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose a reference kind"
    source_readings:
      - sections/section-030/module-01/course-01-workflowtemplate-definitions-and-references.md
    prompt: "A Workflow must reuse the entire definition of a stored template. Which field does it set?"
    options:
      - id: a
        text: "templateRef on one step"
        explanation: "templateRef reuses one template only."
      - id: b
        text: "workflowTemplateRef in the spec"
        explanation: "Correct: workflowTemplateRef reuses the whole definition."
      - id: c
        text: "clusterScope on the pod"
        explanation: "clusterScope is a field of a reference, not of a pod."
      - id: d
        text: "podSpecPatch"
        explanation: "podSpecPatch changes pod fields."
    correct_option: b
    explanation: "Correct: workflowTemplateRef reuses the whole definition."

  - id: ats060-030-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Reference stability"
    source_readings:
      - sections/section-030/module-01/course-01-workflowtemplate-definitions-and-references.md
    prompt: "After a Workflow started with workflowTemplateRef, the template is edited. What happens to the running Workflow?"
    options:
      - id: a
        text: "It switches to the new spec at once"
        explanation: "The stored copy protects the run."
      - id: b
        text: "It keeps the spec that the controller stored in its status"
        explanation: "Correct: the controller keeps a copy of the spec."
      - id: c
        text: "It fails with a version error"
        explanation: "Templates have no version field."
      - id: d
        text: "It is deleted"
        explanation: "Edits never delete runs."
    correct_option: b
    explanation: "Correct: the controller keeps a copy of the spec."

  - id: ats060-030-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Cluster scope"
    source_readings:
      - sections/section-030/module-01/course-02-clusterworkflowtemplate-scope-and-access.md
    prompt: "A reference to a ClusterWorkflowTemplate omits clusterScope. What is the likely result?"
    options:
      - id: a
        text: "It works as normal"
        explanation: "Without the flag the kind is not searched."
      - id: b
        text: "The lookup uses the workflow namespace and fails to find it"
        explanation: "Correct: the lookup is namespaced."
      - id: c
        text: "The template is copied to the namespace"
        explanation: "No copy is made."
      - id: d
        text: "The controller creates the template"
        explanation: "The controller never creates templates."
    correct_option: b
    explanation: "Correct: the lookup is namespaced."

  - id: ats060-030-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Cluster permissions"
    source_readings:
      - sections/section-030/module-01/course-02-clusterworkflowtemplate-scope-and-access.md
    prompt: "Who needs permission to read a ClusterWorkflowTemplate at run time?"
    options:
      - id: a
        text: "Every workflow pod"
        explanation: "Pods do not read templates."
      - id: b
        text: "The controller"
        explanation: "Correct: the controller resolves references."
      - id: c
        text: "The artifact repository"
        explanation: "The repository holds artifacts."
      - id: d
        text: "The node"
        explanation: "Nodes do not resolve references."
    correct_option: b
    explanation: "Correct: the controller resolves references."

  - id: ats060-030-q06
    type: single_choice
    difficulty: beginner
    learning_objective: "Template types"
    source_readings:
      - sections/section-030/module-02/course-01-template-types.md
    prompt: "Which template type pauses a workflow without creating a pod?"
    options:
      - id: a
        text: "container"
        explanation: "It runs a pod."
      - id: b
        text: "script"
        explanation: "It runs a pod too."
      - id: c
        text: "suspend"
        explanation: "Correct: suspend creates no pod."
      - id: d
        text: "resource"
        explanation: "It changes an object and uses the controller."
    correct_option: c
    explanation: "Correct: suspend creates no pod."

  - id: ats060-030-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Script output"
    source_readings:
      - sections/section-030/module-02/course-01-template-types.md
    prompt: "Where does the standard output of a script template appear?"
    options:
      - id: a
        text: "In the outputs.result field of its node"
        explanation: "Correct: it becomes outputs.result."
      - id: b
        text: "In a ConfigMap"
        explanation: "No ConfigMap is made."
      - id: c
        text: "In the Workflow metadata"
        explanation: "Metadata is not changed."
      - id: d
        text: "In the template spec"
        explanation: "The spec is not changed."
    correct_option: a
    explanation: "Correct: it becomes outputs.result."

  - id: ats060-030-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Steps order"
    source_readings:
      - sections/section-030/module-02/course-02-composing-templates-with-steps-and-dag.md
    prompt: "In a steps template, how do the outer groups and the inner steps run?"
    options:
      - id: a
        text: "All in parallel"
        explanation: "The groups are ordered."
      - id: b
        text: "Outer groups in order, inner steps in parallel"
        explanation: "Correct."
      - id: c
        text: "All in order"
        explanation: "Inner steps run at once."
      - id: d
        text: "Inner steps in order, outer groups in parallel"
        explanation: "The reverse of the real behavior."
    correct_option: b
    explanation: "Correct."

  - id: ats060-030-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Pass values"
    source_readings:
      - sections/section-030/module-02/course-02-composing-templates-with-steps-and-dag.md
    prompt: "Which tag reads the result of a step named shout from a later step?"
    options:
      - id: a
        text: "{{steps.shout.outputs.result}}"
        explanation: "Correct."
      - id: b
        text: "{{workflow.shout.result}}"
        explanation: "No such workflow tag exists."
      - id: c
        text: "{{inputs.shout}}"
        explanation: "Inputs hold values passed in."
      - id: d
        text: "{{item.shout}}"
        explanation: "Item tags belong to loops."
    correct_option: a
    explanation: "Correct."

  - id: ats060-030-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Argument override"
    source_readings:
      - sections/section-030/module-02/course-02-composing-templates-with-steps-and-dag.md
    prompt: "A WorkflowTemplate declares the argument crew with a default. A Workflow that uses it sets crew to another value. Which value does a step reading the workflow parameter see?"
    options:
      - id: a
        text: "The default of the template"
        explanation: "The Workflow value overrides the default."
      - id: b
        text: "The value set in the Workflow"
        explanation: "Correct: the run value wins."
      - id: c
        text: "Both, joined together"
        explanation: "Values are not joined."
      - id: d
        text: "Neither, it is empty"
        explanation: "The parameter is defined."
    correct_option: b
    explanation: "Correct: the run value wins."

