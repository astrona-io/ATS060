schema_version: 1
kind: question_bank
id: ats060-section-030
course_id: ATS060
exam_code: CAPA
status: draft
provenance: Original practice material; not official examination questions.
scope:
  type: section
  id: section-030
  title: 'Checkpoint: Workflow Resources, Templates And Execution Ownership, Generating, Storing And Consuming
    Workflow Artifacts, Reusable WorkflowTemplate And ClusterWorkflowTemplate Definitions'
placement:
  position: after
  reading: sections/section-030/module-01/course-02-summary.md
questions:
- id: ats060-section-030-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Distinguish a Workflow execution from its reusable templates.
  source_readings:
  - sections/section-010/module-01/course-01-workflow-resources-templates-and-execution-ownership.md
  prompt: What does a Workflow resource represent?
  options:
  - id: a
    text: A permanent Kubernetes Service endpoint only.
    explanation: Services and workflows serve different roles.
  - id: b
    text: Every Git repository in an organization.
    explanation: Repository inventory is unrelated.
  - id: c
    text: A declared execution and its lifecycle state.
    explanation: It is distinct from a reusable definition.
  correct_option: c
  explanation: It is distinct from a reusable definition.
- id: ats060-section-030-q02
  type: single_choice
  difficulty: beginner
  learning_objective: Explain controller, Pod and executor responsibilities.
  source_readings:
  - sections/section-010/module-01/course-01-workflow-resources-templates-and-execution-ownership.md
  prompt: Which responsibility belongs to the workflow controller?
  options:
  - id: a
    text: Granting unrestricted credentials to every task automatically.
    explanation: Task permissions need explicit design.
  - id: b
    text: Reconciling declared workflow tasks and state.
    explanation: It coordinates the execution model.
  - id: c
    text: Performing every data transformation inside its own process.
    explanation: Task workloads perform the work.
  correct_option: b
  explanation: It coordinates the execution model.
- id: ats060-section-030-q03
  type: single_choice
  difficulty: beginner
  learning_objective: Interpret entrypoint, arguments and node status.
  source_readings:
  - sections/section-010/module-01/course-01-workflow-resources-templates-and-execution-ownership.md
  prompt: What identifies where a Workflow begins?
  options:
  - id: a
    text: Its entrypoint template relationship.
    explanation: That selects the initial execution definition.
  - id: b
    text: Only its dashboard color.
    explanation: Presentation does not define entrypoint.
  - id: c
    text: Only a node's hostname.
    explanation: Placement is separate.
  correct_option: a
  explanation: That selects the initial execution definition.
- id: ats060-section-030-q04
  type: single_choice
  difficulty: beginner
  learning_objective: Distinguish artifacts from scalar parameters.
  source_readings:
  - sections/section-020/module-01/course-01-generating-storing-and-consuming-workflow-artifacts.md
  prompt: Which input is naturally an artifact?
  options:
  - id: a
    text: Only a boolean retry flag.
    explanation: That fits a parameter.
  - id: b
    text: Only the controller's display name.
    explanation: It is metadata rather than task data.
  - id: c
    text: A dataset file consumed by a later task.
    explanation: It is transferred data rather than a small scalar setting.
  correct_option: c
  explanation: It is transferred data rather than a small scalar setting.
- id: ats060-section-030-q05
  type: single_choice
  difficulty: beginner
  learning_objective: Trace output files through repository storage and input references.
  source_readings:
  - sections/section-020/module-01/course-01-generating-storing-and-consuming-workflow-artifacts.md
  prompt: Does writing a file inside one Pod automatically make it available to every later task?
  options:
  - id: a
    text: Yes; a parameter name copies every file.
    explanation: Parameters do not provide arbitrary file transfer.
  - id: b
    text: No; declared output handling and a supported transfer path are needed.
    explanation: Pod filesystems are not universally shared.
  - id: c
    text: Yes; all task roots are one global directory.
    explanation: Pod storage boundaries differ.
  correct_option: b
  explanation: Pod filesystems are not universally shared.
- id: ats060-section-030-q06
  type: single_choice
  difficulty: beginner
  learning_objective: Explain repository credentials and retention ownership.
  source_readings:
  - sections/section-020/module-01/course-01-generating-storing-and-consuming-workflow-artifacts.md
  prompt: Why scope artifact repository credentials?
  options:
  - id: a
    text: They govern access to retained data outside the Pod.
    explanation: Overbroad credentials increase exposure.
  - id: b
    text: Artifact names encrypt every object automatically.
    explanation: Names do not supply confidentiality.
  - id: c
    text: Controller status revokes all storage access on completion.
    explanation: Credential lifecycle is separate.
  correct_option: a
  explanation: Overbroad credentials increase exposure.
- id: ats060-section-030-q07
  type: single_choice
  difficulty: beginner
  learning_objective: Distinguish inline task templates from reusable resources.
  source_readings:
  - sections/section-030/module-01/course-01-reusable-workflowtemplate-and-clusterworkflowtemplate-definitions.md
  prompt: How does a WorkflowTemplate differ from an inline template?
  options:
  - id: a
    text: It is always a running Pod.
    explanation: Definitions and execution differ.
  - id: b
    text: It automatically stores all outputs forever.
    explanation: Retention needs its own configuration.
  - id: c
    text: It is a separately managed reusable resource.
    explanation: Inline definitions belong to their containing workflow.
  correct_option: c
  explanation: Inline definitions belong to their containing workflow.
- id: ats060-section-030-q08
  type: single_choice
  difficulty: beginner
  learning_objective: Compare namespaced WorkflowTemplate with ClusterWorkflowTemplate.
  source_readings:
  - sections/section-030/module-01/course-01-reusable-workflowtemplate-and-clusterworkflowtemplate-definitions.md
  prompt: What distinguishes ClusterWorkflowTemplate?
  options:
  - id: a
    text: It must run only on control-plane nodes.
    explanation: Definition scope does not define placement.
  - id: b
    text: Its resource scope supports cluster-level reusable definition lookup.
    explanation: Scope changes governance and reference behavior.
  - id: c
    text: It grants every task cluster-admin.
    explanation: Resource scope does not automatically grant task authority.
  correct_option: b
  explanation: Scope changes governance and reference behavior.
- id: ats060-section-030-q09
  type: single_choice
  difficulty: beginner
  learning_objective: Explain templateRef, workflowTemplateRef and supplied arguments.
  source_readings:
  - sections/section-030/module-01/course-01-reusable-workflowtemplate-and-clusterworkflowtemplate-definitions.md
  prompt: Why check reference and arguments together?
  options:
  - id: a
    text: The selected definition must receive compatible required inputs.
    explanation: A valid resource name alone is insufficient.
  - id: b
    text: Arguments rewrite all previous runs automatically.
    explanation: Historical execution state is not universally rewritten.
  - id: c
    text: Every reference copies all cluster credentials.
    explanation: Credential handling is separate.
  correct_option: a
  explanation: A valid resource name alone is insufficient.
