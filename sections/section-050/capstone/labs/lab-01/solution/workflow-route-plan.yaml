apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: route-plan
  namespace: starfleet
spec:
  serviceAccountName: workflow-runner
  entrypoint: pipeline
  activeDeadlineSeconds: 300
  parallelism: 2
  templates:
  - name: pipeline
    dag:
      tasks:
      - name: scan
        template: decide
      - name: proceed
        template: act
        dependencies:
        - scan
        when: '{{tasks.scan.outputs.result}} == clear'
      - name: hold
        template: act
        dependencies:
        - scan
        when: '{{tasks.scan.outputs.result}} != clear'
      - name: survey
        template: sector
        dependencies:
        - scan
        arguments:
          parameters:
          - name: sector
            value: '{{item}}'
        withItems:
        - alpha
        - beta
        - gamma
      - name: report
        template: act
        depends: (proceed || hold) && survey
  - name: decide
    script:
      image: docker.io/library/python:3.13-alpine
      command:
      - python
      source: |
        print("clear")
  - name: sector
    inputs:
      parameters:
      - name: sector
    container:
      image: docker.io/library/python:3.13-alpine
      command:
      - python
      - -c
      args:
      - print('scanned {{inputs.parameters.sector}}')
  - name: act
    container:
      image: docker.io/library/python:3.13-alpine
      command:
      - python
      - -c
      args:
      - print('acting')
